<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090b">
  <title>PyLab — Python Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menü öffnen">☰</button>
    <a class="brand" href="#/dashboard" aria-label="Zum Dashboard">
      <span class="brand-mark">py</span>
      <span class="brand-name">PyLab</span>
      <span class="brand-tag">Deep Space IDE</span>
    </a>
    <div class="crumbs" id="crumbs"></div>
    <div class="topbar-right">
      <div class="py-status" id="pyStatus" data-state="loading"><i></i><span>Python lädt …</span></div>
      <div id="topRing" title="Gesamtfortschritt"></div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar"><nav id="nav" aria-label="Lehrplan"></nav></aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main"></main>

  <script src="js/content.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
