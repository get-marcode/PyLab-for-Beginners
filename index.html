<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/png" href="assets/marcode-logo.png">
  <script>
    /* Theme vor dem ersten Rendern setzen, damit nichts flackert. */
    try {
      var t = localStorage.getItem('pylab.theme');
      if (t === 'light') t = 'day';
      var mode = { day: 1, sand: 1, nebel: 1, rose: 1, ocean: 0, forest: 0, dusk: 0 };
      if (t in mode) {
        document.documentElement.dataset.theme = t;
        if (mode[t]) document.documentElement.dataset.mode = 'light';
      }
    } catch (e) {}
  </script>
  <title>PyLab — Python Trainer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" data-i18n-aria="a11y.menu" aria-label="Open menu">☰</button>
    <a class="brand" href="#/dashboard" data-i18n-aria="a11y.home" aria-label="Go to dashboard">
      <img class="brand-mark logo-dark" src="assets/marcode-logo.png" alt="MarCode-Logo" width="48" height="48">
      <img class="brand-mark logo-light" src="assets/marcode-logo-light.png" alt="" width="48" height="48" aria-hidden="true">
      <span class="brand-name">PyLab</span>
      <span class="brand-tag">Deep Space IDE</span>
    </a>
    <div class="crumbs" id="crumbs"></div>
    <div class="topbar-right">
      <div class="timer-wrap" id="timerWrap"></div>
      <div class="theme-wrap">
        <button class="theme-btn lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false"><span>DE</span></button>
        <div class="theme-menu" id="langMenu" role="menu" hidden></div>
      </div>
      <div class="theme-wrap">
        <button class="theme-btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Choose colour theme" title="Choose colour theme">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.8-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7-9-7z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10.5" cy="7" r="1" fill="currentColor"/><circle cx="15.5" cy="7.5" r="1" fill="currentColor"/></svg>
        </button>
        <div class="theme-menu" id="themeMenu" role="menu" aria-label="Colour theme" hidden></div>
      </div>
      <div class="py-status" id="pyStatus" data-state="loading"><i></i><span data-i18n="py.loading">Loading Python …</span></div>
      <div id="topRing" data-i18n-title="a11y.progress" title="Overall progress"></div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar"><nav id="nav" data-i18n-aria="a11y.nav" aria-label="Curriculum"></nav></aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main"></main>

  <footer class="site-foot">
    <span>PyLab · © 2026 <a href="https://github.com/get-marcode" target="_blank" rel="noopener">Marcode</a></span>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/get-marcode/PyLab-for-Beginners/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="foot.license">MIT-Lizenz</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/get-marcode/PyLab-for-Beginners" target="_blank" rel="noopener" data-i18n="foot.source">Quellcode auf GitHub</a>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/meta-en.js"></script>
  <script src="js/explain.js"></script>
  <script src="js/content.js"></script>
  <script src="js/content-en.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
